<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Confirme seu pedido - Burger.IO">
    <meta name="theme-color" content="#ff6b35">
    <title>Confirmar Pedido - Burger.IO</title>

    <!-- Icons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header class="app_bar">
        <a href="index.html" title="Voltar para início">
            <i class='bx bx-home-alt'></i>
        </a>
        <div class="app_logo">
            <img src="assets/burgerio_logo.png" alt="Burger.IO - Logo da Hamburgueria">
        </div>
        <i class='bx bx-cart' title="Carrinho"></i>
    </header>

    <main class="home-confirm">
        <h1>Confirme seu Pedido</h1>

        <section class="order-itens">
            <div class="order-card">
                <div class="card-image">
                    <img id="item-image" src="assets/burgerio_logo.png" alt="Imagem do produto">
                </div>

                <div class="card-details">
                    <h2 id="item-name">Carregando...</h2>
                    <h3 id="item-price">R$ 0,00</h3>
                    <p>
                        Hambúrguer artesanal preparado com ingredientes frescos e de qualidade.
                        Entrega rápida e segura!
                    </p>
                </div>
            </div>

            <button class="button-confirm" onclick="openWhatsApp()">
                <i class='bx bxl-whatsapp'></i> Fazer o Pedido
            </button>
        </section>
    </main>

    <script src="js/confirm-order.js"></script>
</body>

</html>
